<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notifications — BRACU Marketplace</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #3b82f6;
      --primary-dark: #2563eb;
      --secondary: #0f172a;
      --bg: #f8fafc;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --card-bg: #ffffff;
      --glass: rgba(255, 255, 255, 0.85);
      --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
      --shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
      --shadow-lg: 0 25px 50px -12px rgb(0 0 0 / 0.15);
      --gradient: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Outfit', sans-serif;
      background: var(--bg);
      color: var(--text-main);
      line-height: 1.6;
      min-height: 100vh;
    }

    /* ── Navbar ── */
    nav {
      background: var(--glass);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 1000;
      padding: 0 40px;
      height: 80px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .nav-logo {
      font-size: 24px;
      font-weight: 800;
      text-decoration: none;
      background: linear-gradient(135deg, var(--secondary) 0%, var(--primary) 100%);
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.03em;
    }

    #navRight {
      display: flex;
      align-items: center;
      gap: 32px;
    }

    .nav-link {
      text-decoration: none;
      font-size: 15px;
      font-weight: 600;
      color: var(--text-muted);
      transition: all 0.2s;
    }

    .nav-link:hover {
      color: var(--primary);
      transform: translateY(-1px);
    }

    .nav-btn {
      background: transparent;
      border: 1px solid var(--border);
      padding: 10px 24px;
      border-radius: 14px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      color: var(--text-muted);
      transition: all 0.2s;
    }

    .nav-btn:hover {
      border-color: #ef4444;
      color: #ef4444;
      background: #fef2f2;
    }

    /* ── Page layout ── */
    .page { max-width: 800px; margin: 40px auto; padding: 0 40px 80px; }

    /* ── Header ── */
    .page-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 32px;
    }
    .page-header h1 {
      font-size: 32px;
      font-weight: 800;
      color: var(--secondary);
      letter-spacing: -0.04em;
    }
    .header-actions { display: flex; gap: 16px; }
    .btn-text {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      color: var(--text-muted);
      transition: all 0.2s;
    }
    .btn-text:hover { color: var(--primary); }
    .btn-text.danger:hover { color: #ef4444; }

    /* ── Filter tabs ── */
    .filter-tabs {
      display: flex; gap: 10px; margin-bottom: 24px; flex-wrap: wrap;
    }
    .filter-tab {
      padding: 10px 20px;
      border-radius: 14px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      border: 1px solid var(--border);
      background: var(--card-bg);
      color: var(--text-muted);
      transition: all 0.2s;
    }
    .filter-tab.active, .filter-tab:hover {
      background: var(--secondary);
      color: #fff;
      border-color: var(--secondary);
    }

    /* ── Notification card ── */
    .notif-card {
      background: var(--card-bg);
      border-radius: 20px;
      border: 1px solid var(--border);
      padding: 24px;
      margin-bottom: 16px;
      display: flex;
      gap: 20px;
      align-items: flex-start;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      cursor: pointer;
      box-shadow: var(--shadow-sm);
    }
    .notif-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow);
      border-color: var(--primary);
    }
    .notif-card.unread { background: rgba(59, 130, 246, 0.03); border-color: rgba(59, 130, 246, 0.2); }

    .notif-icon-wrap {
      width: 48px; height: 48px; border-radius: 16px;
      background: var(--bg); display: flex; align-items: center;
      justify-content: center; font-size: 24px; flex-shrink: 0;
      border: 1px solid var(--border);
    }
    .notif-icon-wrap.type-message  { background: #e0f2fe; color: #0369a1; }
    .notif-icon-wrap.type-order    { background: #dcfce7; color: #15803d; }
    .notif-icon-wrap.type-payment  { background: #fef9c3; color: #a16207; }
    .notif-icon-wrap.type-review   { background: #fef3c7; color: #b45309; }
    .notif-icon-wrap.type-report   { background: #fee2e2; color: #b91c1c; }
    .notif-icon-wrap.type-system   { background: #f3e8ff; color: #7e22ce; }

    .notif-content { flex: 1; min-width: 0; }
    .notif-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--secondary);
      margin-bottom: 4px;
      letter-spacing: -0.01em;
    }
    .notif-card.unread .notif-title { color: var(--primary); }
    .notif-body  { font-size: 14px; color: var(--text-muted); margin-bottom: 8px; }
    .notif-time  { font-size: 12px; font-weight: 600; color: #94a3b8; }

    .notif-right {
      display: flex; flex-direction: column;
      align-items: flex-end; gap: 12px; flex-shrink: 0;
    }
    .unread-dot {
      width: 10px; height: 10px; border-radius: 50%; background: var(--primary);
      box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1);
    }
    .btn-delete-notif {
      background: none; border: none; cursor: pointer;
      font-size: 18px; color: #cbd5e1; transition: all 0.2s;
    }
    .btn-delete-notif:hover { color: #ef4444; transform: scale(1.1); }

    /* ── Empty state ── */
    .empty {
      text-align: center; padding: 60px 20px; color: #999;
    }
    .empty-icon { font-size: 52px; margin-bottom: 12px; }
    .empty p    { font-size: 15px; }

    /* ── Loading skeleton ── */
    .skeleton {
      background: linear-gradient(90deg, #e8e8e8 25%, #f5f5f5 50%, #e8e8e8 75%);
      background-size: 400px 100%;
      animation: shimmer 1.3s infinite;
      border-radius: 8px;
    }
    @keyframes shimmer {
      0%   { background-position: -400px 0; }
      100% { background-position:  400px 0; }
    }
    .skel-card {
      height: 76px; margin-bottom: 10px; border-radius: 10px;
    }
  </style>
</head>
<body>

<!-- ── Navbar ── -->
<nav>
  <a href="/" class="nav-logo">BRACU Marketplace</a>
  <div id="navRight">
    <a href="/"             class="nav-link">Home</a>
    <a href="/listings"     class="nav-link">Browse</a>
    <a href="/transactions"  class="nav-link">Transactions</a>
    <a href="/wishlist"       class="nav-link">Wishlist</a>
    <a href="/profile"      class="nav-link">Profile</a>
    <a href="/sell"         class="nav-link">Sell</a>
    <button onclick="logout()" style="
      background:none;border:1px solid #555;color:#ccc;
      padding:5px 12px;border-radius:5px;cursor:pointer;
      font-size:13px;font-family:Arial,sans-serif;">Logout</button>
  </div>
</nav>

<!-- ── Main content ── -->
<div class="page">
  <div class="page-header">
    <h1>🔔 Notifications</h1>
    <div class="header-actions">
      <button class="btn-text" onclick="markAllRead()">Mark all as read</button>
      <button class="btn-text danger" onclick="clearAll()">Clear all</button>
    </div>
  </div>

  <!-- Filter tabs -->
  <div class="filter-tabs">
    <button class="filter-tab active" onclick="setFilter('all',    this)">All</button>
    <button class="filter-tab"        onclick="setFilter('message', this)">💬 Messages</button>
    <button class="filter-tab"        onclick="setFilter('order',   this)">🛒 Orders</button>
    <button class="filter-tab"        onclick="setFilter('payment', this)">💳 Payments</button>
    <button class="filter-tab"        onclick="setFilter('report',  this)">🚩 Reports</button>
    <button class="filter-tab"        onclick="setFilter('system',  this)">📢 System</button>
  </div>

  <!-- Notification list -->
  <div id="notifContainer">
    <!-- Skeleton loading state -->
    <div class="skeleton skel-card"></div>
    <div class="skeleton skel-card"></div>
    <div class="skeleton skel-card"></div>
  </div>
</div>

<!-- Socket.IO client -->
<script src="/socket.io/socket.io.js"></script>
<!-- Reusable notification bell widget -->
<script src="/js/notifications.js"></script>

<script>
  const TOKEN = localStorage.getItem('token');
  const USER  = JSON.parse(localStorage.getItem('user') || 'null');

  // Redirect to login if not authenticated
  if (!TOKEN || !USER) window.location.href = '/login';

  let allNotifications = [];   // cached full list
  let currentFilter    = 'all';

  // ── Load all notifications ───────────────────────────────────
  async function loadNotifications() {
    try {
      const res  = await fetch('/api/notifications', {
        headers: { Authorization: `Bearer ${TOKEN}` },
      });
      const data = await res.json();

      if (!data.success) throw new Error(data.message);

      allNotifications = data.data || [];
      renderList();

    } catch (err) {
      document.getElementById('notifContainer').innerHTML =
        `<p style="color:#c00;text-align:center;padding:32px;">
          Failed to load notifications. Please refresh.
        </p>`;
    }
  }

  // ── Render filtered list ─────────────────────────────────────
  function renderList() {
    const container = document.getElementById('notifContainer');
    const filtered  = currentFilter === 'all'
      ? allNotifications
      : allNotifications.filter(n => n.type === currentFilter);

    if (filtered.length === 0) {
      container.innerHTML = `
        <div class="empty">
          <div class="empty-icon">🔔</div>
          <p>No ${currentFilter === 'all' ? '' : currentFilter + ' '}notifications yet.</p>
        </div>`;
      return;
    }

    container.innerHTML = filtered.map(n => `
      <div class="notif-card ${n.is_read ? '' : 'unread'}"
           onclick="handleNotifClick(${n.notification_id}, '${n.link || ''}')">
        <div class="notif-icon-wrap type-${n.type}">${iconFor(n.type)}</div>
        <div class="notif-content">
          <p class="notif-title">${n.title}</p>
          <p class="notif-body">${n.body}</p>
          <p class="notif-time">${timeAgo(n.created_at)}</p>
        </div>
        <div class="notif-right">
          ${!n.is_read ? '<div class="unread-dot"></div>' : ''}
          <button class="btn-delete-notif"
                  onclick="event.stopPropagation(); deleteNotif(${n.notification_id})"
                  title="Delete">✕</button>
        </div>
      </div>`).join('');
  }

  // ── Filter tabs ──────────────────────────────────────────────
  function setFilter(filter, btn) {
    currentFilter = filter;
    document.querySelectorAll('.filter-tab').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderList();
  }

  // ── Click a notification ─────────────────────────────────────
  async function handleNotifClick(notifId, link) {
    // Mark as read
    await fetch(`/api/notifications/${notifId}/read`, {
      method: 'PUT', headers: { Authorization: `Bearer ${TOKEN}` },
    }).catch(() => {});

    // Update local cache
    const n = allNotifications.find(x => x.notification_id === notifId);
    if (n) n.is_read = true;
    renderList();

    // Navigate to the linked page if there is one
    if (link) window.location.href = link;
  }

  // ── Mark all as read ─────────────────────────────────────────
  async function markAllRead() {
    await fetch('/api/notifications/all/read', {
      method: 'PUT', headers: { Authorization: `Bearer ${TOKEN}` },
    }).catch(() => {});
    allNotifications.forEach(n => n.is_read = true);
    renderList();

    // Reset bell badge
    const badge = document.getElementById('notifBadge');
    if (badge) badge.style.display = 'none';
  }

  // ── Clear all notifications ───────────────────────────────────
  async function clearAll() {
    if (!confirm('Delete all notifications? This cannot be undone.')) return;
    await fetch('/api/notifications/all', {
      method: 'DELETE', headers: { Authorization: `Bearer ${TOKEN}` },
    }).catch(() => {});
    allNotifications = [];
    renderList();
  }

  // ── Delete one notification ───────────────────────────────────
  async function deleteNotif(notifId) {
    await fetch(`/api/notifications/${notifId}`, {
      method: 'DELETE', headers: { Authorization: `Bearer ${TOKEN}` },
    }).catch(() => {});
    allNotifications = allNotifications.filter(n => n.notification_id !== notifId);
    renderList();
  }

  // ── Listen for real-time new notifications ────────────────────
  // (socket.io client is loaded above, notifications.js connects it)
  document.addEventListener('DOMContentLoaded', () => {
    loadNotifications();
  });

  // When a new notification arrives via socket, prepend it live
  window.addEventListener('new_notification', (e) => {
    allNotifications.unshift(e.detail);
    renderList();
  });

  // ── Helpers ───────────────────────────────────────────────────
  function iconFor(type) {
    const m = { message:'💬', order:'🛒', payment:'💳', review:'⭐', report:'🚩', system:'📢' };
    return m[type] || '🔔';
  }

  function timeAgo(dateStr) {
    const s = Math.floor((Date.now() - new Date(dateStr)) / 1000);
    if (s < 60)     return 'just now';
    if (s < 3600)   return `${Math.floor(s/60)}m ago`;
    if (s < 86400)  return `${Math.floor(s/3600)}h ago`;
    return `${Math.floor(s/86400)}d ago`;
  }

  function logout() {
    localStorage.removeItem('token');
    localStorage.removeItem('user');
    window.location.href = '/login';
  }
</script>
</body>
</html>
